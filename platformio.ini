; ==============================================================================
; MotoNav PlatformIO 编译配置文件
; 支持 M5Stack Stopwatch 与微雪 1.75 / 185B，与原项目 Arduino Core 3.3.10 保持完全一致
; ==============================================================================

[platformio]
default_envs = stopwatch
src_dir = firmware/boards/stopwatch/MotoNav

[env]
; 使用针对 Arduino Core 3.3.10 优化的 pioarduino espressif32 平台
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = firmware/libraries

; ------------------------------------------------------------------------------
; 1. M5Stack Stopwatch (开发适配板型 - 基于 M5Unified 官方闭环驱动)
; ------------------------------------------------------------------------------
[env:stopwatch]
board = esp32s3box
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = firmware/partitions_16M.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Ifirmware/boards/stopwatch/MotoNav
extra_scripts = post:tools/pio_merge.py

; ------------------------------------------------------------------------------
; 2. 微雪 1.75 AMOLED (上游基准板型)
; ------------------------------------------------------------------------------
[env:waveshare_175]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = firmware/partitions_16M.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Ifirmware/boards/175/MotoNav
